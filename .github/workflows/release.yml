name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Lets npm verify this workflow via OIDC (trusted publishing); no npm token needed
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing requires npm 11.5.1+; Node 22 ships with npm 10
      - run: npm install -g npm@11

      - name: Check tag matches package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # prepublishOnly runs typecheck, tests and build first. Provenance is
      # generated automatically when publishing through trusted publishing.
      - run: npm publish
